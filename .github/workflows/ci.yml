name: Blog CI
on:
  push:
    branches: [master, main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Initialize isolated data
        run: npm run setup
        env:
          ADMIN_EMAIL: ci@example.test
          ADMIN_PASSWORD: ci-only-password-do-not-use-2026
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm test
      - name: Verify standalone package excludes private runtime data
        run: |
          BLOG_STANDALONE=1 npm run build
          test ! -e .next/standalone/local-admin.txt
          test ! -d .next/standalone/data
          test ! -d .next/standalone/uploads
          test ! -e .next/standalone/.env.local
      - run: npm audit --omit=dev --audit-level=high
