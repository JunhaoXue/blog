services:
  blog:
    build: ./web
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://xuejunhao.com}
    volumes:
      - ./web/data:/app/data
      - ./web/uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
